        <div class="glass-card slide-up-anim max-w-card capture-ui">
            <div class="capture-header">
                <h3><i class="fa-solid fa-camera"></i> Capture Evidence</h3>
                <span class="status-badge status-review" id="capture-timer">00:00:00</span>
            </div>

            <div class="viewfinder">
                <div class="vf-overlay">
                    <div class="crosshair"></div>
                    <div class="gps-watermark">
                        <i class="fa-solid fa-location-crosshairs"></i> Lat: 40.7128, Lng: -74.0060<br>
                        <i class="fa-solid fa-clock"></i> <span id="capture-timestamp"></span><br>
                        <i class="fa-solid fa-shield-halved"></i> GroundLens Verified
                    </div>
                </div>
            </div>

            <div class="form-actions" style="justify-content:center; gap: 2rem; margin-top:2rem;">
                <button class="btn-magnetic"
                    style="border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; font-size:1.5rem;"
                    onclick="cancelCapture()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button class="btn-primary btn-magnetic" id="btn-shutter"
                    style="border-radius:50%; width:80px; height:80px; display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow: 0 0 30px var(--primary-glow)">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <button class="btn-magnetic"
                    style="border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; font-size:1.5rem;"
                    id="btn-upload-mock" disabled>
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </button>
            </div>
        </div>

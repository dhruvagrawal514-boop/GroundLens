        <div class="req-glass-card slide-up-anim req-max-w-card">
            <h2 class="req-title"><i class="fa-solid fa-crosshairs"></i> New Targeting Request</h2>
            <form id="form-create-task" class="req-form">
                <div class="req-form-group">
                    <label>Target Designation</label>
                    <input type="text" id="task-title" class="req-input-premium" required
                        placeholder="e.g. Verify Parker's queue length" />
                </div>
                <div class="req-form-group">
                    <label>Intelligence Details</label>
                    <textarea id="task-desc" class="req-input-premium" required rows="3"
                        placeholder="Need a 10s video of the main entrance to check current capacity..."></textarea>
                </div>
                <div class="req-form-group">
                    <label>Coordinates (Location)</label>
                    <div class="req-map-radar" id="map-picker">
                        <div class="req-radar-pulse"></div>
                        <i class="fa-solid fa-location-crosshairs req-radar-pin"></i>
                        <span class="req-radar-text">Click to set target zone</span>
                    </div>
                </div>
                <div class="req-form-row">
                    <div class="req-form-group req-half">
                        <label>Capture Mode</label>
                        <div class="req-media-segmented" id="req-media-toggle">
                            <input type="hidden" id="task-media" value="photo">
                            <button type="button" class="req-seg-btn active" data-val="photo"><i
                                    class="fa-solid fa-camera"></i> Photo</button>
                            <button type="button" class="req-seg-btn" data-val="video"><i class="fa-solid fa-video"></i>
                                Video</button>
                        </div>
                    </div>
                    <div class="req-form-group req-half">
                        <label>Bounty ($)</label>
                        <div class="req-budget-wrapper">
                            <span class="req-budget-currency">$</span>
                            <input type="number" id="task-budget" class="req-input-premium req-input-budget" min="5"
                                step="1" required placeholder="15" />
                        </div>
                    </div>
                </div>
                <div class="req-form-actions">
                    <button type="button" class="req-btn-cancel" id="btn-cancel-task">Abort</button>
                    <button type="submit" class="req-btn-primary">Initialize Scan</button>
                </div>
            </form>
        </div>

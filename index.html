<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroundLens | Real photos from any location, on demand</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description" content="Request GPS-verified photos and videos of any location from trusted local Scouts.">
</head>

<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="glass-nav" aria-label="Main">
            <div class="logo" role="link" tabindex="0" aria-label="GroundLens home">
                <div
                    style="background: var(--brand-cyan); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-inverse); font-size: 1.2rem; box-shadow: 0 0 15px var(--brand-cyan-glow);">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div style="font-weight: 700; font-size: 1.5rem; color: var(--text-main); letter-spacing: 0px;">
                    Ground<span style="color: var(--brand-purple);">Lens</span>
                </div>
            </div>

            <div class="nav-links" id="nav-links">
                <!-- Links injected by JS -->
            </div>

            <div class="nav-actions" id="nav-actions">
                <div id="nav-profile" class="nav-profile">
                    <!-- Profile snippet or login actions injected by JS -->
                </div>
            </div>

        </nav>

        <main id="main-content" class="content-container slide-up-anim">
            <!-- Dynamic content swapped here by JS -->
        </main>

        <!-- Floating Notification System -->
        <div id="notification-container" class="notification-container"></div>
    </div>

    <!-- Templates -->
    <!-- Full Dashboard Template (Post-Registration) -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
